name: Sari2 Native Build
on:
  push:
    branches: [sari2-native-build-20260819]
    paths:
      - 'sari2-native-build/**'
      - '.github/workflows/sari2-native-build.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK
        run: yes | sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Restore native project
        run: |
          base64 -d sari2-native-build/payload.b64 > /tmp/sari2.tar.gz
          tar -xzf /tmp/sari2.tar.gz -C /tmp
      - name: Build native APK
        working-directory: /tmp/sari2_ci_payload
        run: gradle --no-daemon :app:assembleRelease
      - name: Extract classes.dex
        run: |
          mkdir -p /tmp/artifact
          unzip -p /tmp/sari2_ci_payload/app/build/outputs/apk/release/app-release-unsigned.apk classes.dex > /tmp/artifact/classes.dex
          cp /tmp/sari2_ci_payload/app/build/outputs/apk/release/app-release-unsigned.apk /tmp/artifact/native-unsigned.apk
          ls -lh /tmp/artifact/*
      - uses: actions/upload-artifact@v4
        with:
          name: sari2-native-v042c
          path: /tmp/artifact/
          retention-days: 1
