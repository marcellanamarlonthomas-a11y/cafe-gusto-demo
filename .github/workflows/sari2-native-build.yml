name: Sari2 Native Build
on:
  push:
    branches: [sari2-native-build-20260819]
    paths:
      - 'sari2-native-build/payload.b64'
      - '.github/workflows/sari2-native-build.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: sari2-native-build-20260819
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK
        run: yes | sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Restore native project
        run: |
          base64 -d sari2-native-build/payload.b64 > /tmp/sari2.tar.gz
          tar -xzf /tmp/sari2.tar.gz -C /tmp
      - name: Build native APK
        working-directory: /tmp/sari2_ci_payload
        run: gradle --no-daemon :app:assembleRelease
      - name: Publish compiled dex to temp branch
        run: |
          unzip -p /tmp/sari2_ci_payload/app/build/outputs/apk/release/app-release-unsigned.apk classes.dex > /tmp/classes.dex
          base64 -w0 /tmp/classes.dex > sari2-native-build/classes.dex.b64
          printf '%s\n' "$(sha256sum /tmp/classes.dex | awk '{print $1}')" > sari2-native-build/classes.dex.sha256
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add sari2-native-build/classes.dex.b64 sari2-native-build/classes.dex.sha256
          git commit -m 'Sari2 native dex output [skip ci]' || true
          git push origin HEAD:sari2-native-build-20260819
