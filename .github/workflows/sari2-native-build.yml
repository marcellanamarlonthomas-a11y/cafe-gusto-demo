name: Sari2 Native Build
on:
  push:
    branches: [sari2-native-build-20260819]
    paths:
      - 'sari2-native-build/payload.b64'
      - '.github/workflows/sari2-native-build.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: sari2-native-build-20260819
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Prepare Android SDK
        run: |
          export ANDROID_HOME=/usr/local/lib/android/sdk
          export ANDROID_SDK_ROOT=/usr/local/lib/android/sdk
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses >/dev/null || true
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Restore native project
        run: |
          python3 - <<'PY'
          import base64, pathlib
          s=pathlib.Path('sari2-native-build/payload.b64').read_text(encoding='utf-8').strip()
          pathlib.Path('/tmp/sari2.tar.gz').write_bytes(base64.b64decode(s, validate=True))
          PY
          tar -xzf /tmp/sari2.tar.gz -C /tmp
      - name: Add DINOv2 model for Android runtime smoke
        run: |
          mkdir -p /tmp/sari2_native_bridge_ci/app/src/main/assets/www/models
          curl -L --fail --retry 5 --retry-all-errors -o /tmp/sari2_native_bridge_ci/app/src/main/assets/www/models/dinov2-small-int8.onnx \
            'https://huggingface.co/onnx-community/dinov2-small-ONNX/resolve/main/onnx/model_int8.onnx?download=true'
          echo 'e48d69984ee26d089e5c690cb39a727e38b95e2a525d7269f5ac366b02a6c22a  /tmp/sari2_native_bridge_ci/app/src/main/assets/www/models/dinov2-small-int8.onnx' | sha256sum -c -
      - name: Build native bridge
        working-directory: /tmp/sari2_native_bridge_ci
        run: gradle --no-daemon :app:assembleRelease :app:assembleDebug -x lintVitalRelease
      - name: Android native ORT runtime smoke
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          emulator-options: -no-window -no-snapshot -noaudio -no-boot-anim -gpu swiftshader_indirect
          script: |
            adb logcat -c
            adb install -r /tmp/sari2_native_bridge_ci/app/build/outputs/apk/debug/app-debug.apk
            adb shell am start -n com.ltgsystems.sarisaripos.nativebridge/com.ltgsystems.sarisaripos.BridgeSmokeActivity
            for i in $(seq 1 45); do
              LOG="$(adb logcat -d -s Sari2NativeSmoke:I Sari2NativeSmoke:E '*:S' || true)"
              echo "$LOG"
              if echo "$LOG" | grep -q 'NATIVE_SMARTSCAN_PASS'; then
                exit 0
              fi
              if echo "$LOG" | grep -q 'NATIVE_SMARTSCAN_FAIL'; then
                exit 1
              fi
              sleep 1
            done
            echo 'Native Smart Scan smoke timed out'
            exit 1
      - name: Package native runtime bundle
        run: |
          set -eux
          APK=/tmp/sari2_native_bridge_ci/app/build/outputs/apk/release/app-release-unsigned.apk
          mkdir -p /tmp/native-bundle
          unzip -j "$APK" 'classes*.dex' -d /tmp/native-bundle/
          unzip "$APK" 'lib/*' -d /tmp/native-bundle/
          unzip -l "$APK" > /tmp/native-bundle/APK_CONTENTS.txt
          sha256sum /tmp/native-bundle/classes*.dex /tmp/native-bundle/lib/*/*.so > /tmp/native-bundle/SHA256SUMS.txt
          curl -L --fail --retry 3 -o /tmp/native-bundle/apktool_3.0.3.jar https://github.com/iBotPeaches/Apktool/releases/download/v3.0.3/apktool_3.0.3.jar
          echo 'dbf930b076c6b9be08d57c449cacefc3bdd6b71ebd59b3066fc0e1f5b14f9423  /tmp/native-bundle/apktool_3.0.3.jar' | sha256sum -c -
      - uses: actions/upload-artifact@v4
        with:
          name: sari2-native-ort130-bundle
          path: /tmp/native-bundle
          if-no-files-found: error
          retention-days: 1
