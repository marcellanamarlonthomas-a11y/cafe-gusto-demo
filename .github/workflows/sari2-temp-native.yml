name: Sari2 Temporary Native Compiler
on:
  push:
    branches: [main]
    paths: ['.github/workflows/sari2-temp-native.yml']

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout temp Sari2 branch
        uses: actions/checkout@v4
        with:
          ref: sari2-native-build-20260819
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - run: yes | sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Restore and compile
        run: |
          base64 -d sari2-native-build/payload.b64 > /tmp/sari2.tar.gz
          tar -xzf /tmp/sari2.tar.gz -C /tmp
          cd /tmp/sari2_ci_payload
          gradle --no-daemon :app:assembleRelease
          unzip -p app/build/outputs/apk/release/app-release-unsigned.apk classes.dex > /tmp/classes.dex
      - name: Publish dex on temp branch
        run: |
          base64 -w0 /tmp/classes.dex > sari2-native-build/classes.dex.b64
          sha256sum /tmp/classes.dex | awk '{print $1}' > sari2-native-build/classes.dex.sha256
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add sari2-native-build/classes.dex.b64 sari2-native-build/classes.dex.sha256
          git commit -m 'Sari2 compiled native dex [skip ci]' || true
          git push origin HEAD:sari2-native-build-20260819
